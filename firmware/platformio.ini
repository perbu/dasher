; dasher dashboard firmware for the Wireless-Tag WT32-SC01 Plus.
;
; Board: ESP32-S3 (16MB flash, 2MB QSPI PSRAM), 3.5" 480x320 ST7796UI on an
; 8-bit parallel (i8080) bus, FT6336U capacitive touch on I2C.
;
; NOT the original WT32-SC01, which is an ESP32-WROVER-B with the panel on SPI
; — a different MCU architecture and a different display bus. The two boards
; share a name, a panel and nothing else that matters here.

[env:wt32-sc01-plus]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The stock board definition assumes 8MB flash and octal PSRAM; this board has
; 16MB flash and 2MB quad PSRAM.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

lib_deps =
	lovyan03/LovyanGFX@^1.1.16
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.1.0

build_flags =
	-DBOARD_HAS_PSRAM
	; Serial arrives over the S3's native USB-Serial/JTAG, not a UART bridge.
	; Without these, Serial.print goes nowhere.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DLGFX_USE_V1
	-DCORE_DEBUG_LEVEL=1
