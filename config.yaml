# dasher configuration.
# Secrets may reference environment variables with ${VAR} syntax.

mqtt:
  listen_addr: ":8883"
  tls_cert: ${MQTT_TLS_CERT}         # server certificate
  tls_key: ${MQTT_TLS_KEY}           # server private key
  tls_client_ca: ${MQTT_CLIENT_CA}   # CA that signs subscriber client certs
  topic: dashboard/data

github:
  token: ${GITHUB_TOKEN}  # classic PAT, notifications scope (fine-grained PATs don't work)
  interval: 5m

claude:
  # Access tokens expire within hours, so dasher authenticates with a refresh
  # token and mints access tokens itself. Seed refresh_token from Claude Code's
  # stored credentials (see README).
  refresh_token: ${CLAUDE_REFRESH_TOKEN}
  client_id: ${CLAUDE_CLIENT_ID}   # Claude Code's public OAuth client id
  token_url: https://console.anthropic.com/v1/oauth/token
  url: https://api.anthropic.com/api/oauth/usage
  # Refreshed credentials land here (0600). The endpoint may rotate the refresh
  # token, so once written this file outranks refresh_token above.
  token_cache: claude-token.json
  interval: 5m

yr:
  # Norge/Oslo/Oslo/Nydalsdammen (approx. 59.9497 N, 10.7665 E)
  lat: 59.9497
  lon: 10.7665
  user_agent: "dasher/per.buer@gmail.com Norge/Oslo/Oslo/Nydalsdammen"
  interval: 15m

# Google Calendar "next meeting". Optional — remove the section (or leave
# client_id empty) to disable. Needs a Google Cloud OAuth client (Desktop
# type) with the Calendar API enabled; the refresh token must be issued by
# that client with the calendar.readonly scope. Works like the claude
# section: dasher mints access tokens itself, and once token_cache is written
# it outranks refresh_token here.
calendar:
  refresh_token: ${GOOGLE_REFRESH_TOKEN}
  client_id: ${GOOGLE_CLIENT_ID}
  client_secret: ${GOOGLE_CLIENT_SECRET}
  token_cache: google-token.json
  calendar_id: primary
  interval: 2m

publish:
  # Payloads are published as soon as a fetch lands; this is the heartbeat
  # ceiling, i.e. the longest the retained message goes without a refresh.
  interval: 30s

# Presence detection: pings a host on the LAN (typically your laptop); while
# it does not answer, the device is assumed unattended and turns its screen
# off. Omit host to disable the check. The host must answer ICMP — on macOS
# that means Stealth Mode off in the firewall settings.
presence:
  host: 192.168.1.50
  interval: 30s
