# dasher configuration.
# Secrets may reference environment variables with ${VAR} syntax.

mqtt:
  listen_addr: ":8883"
  tls_cert: ${MQTT_TLS_CERT}         # server certificate
  tls_key: ${MQTT_TLS_KEY}           # server private key
  tls_client_ca: ${MQTT_CLIENT_CA}   # CA that signs subscriber client certs
  topic: dashboard/data

github:
  token: ${GITHUB_TOKEN}  # classic PAT, notifications scope (fine-grained PATs don't work)
  interval: 5m

claude:
  # Access tokens expire within hours, so dasher authenticates with a refresh
  # token and mints access tokens itself. Seed refresh_token from Claude Code's
  # stored credentials (see README).
  refresh_token: ${CLAUDE_REFRESH_TOKEN}
  client_id: ${CLAUDE_CLIENT_ID}   # Claude Code's public OAuth client id
  token_url: https://console.anthropic.com/v1/oauth/token
  url: https://api.anthropic.com/api/oauth/usage
  # Refreshed credentials land here (0600). The endpoint may rotate the refresh
  # token, so once written this file outranks refresh_token above.
  token_cache: claude-token.json
  interval: 5m

yr:
  # Norge/Oslo/Oslo/Nydalsdammen (approx. 59.9497 N, 10.7665 E)
  lat: 59.9497
  lon: 10.7665
  user_agent: "dasher/per.buer@gmail.com Norge/Oslo/Oslo/Nydalsdammen"
  interval: 15m

publish:
  interval: 30s
